        <div class="trapezio">

            <label for="basemenor">Base menor</label>
            <input type="number">

            <div class="resultado"><!-- div que recebe o resultado --></div>
            <button>calcular</button>
            <button>Limpar</button>
        </div>

        <div class="cirbulo">
            <h3>Círculo</h3>

            <input type="number">
            <div class="resultado"><!-- div que recebe o resultado --></div>

</div>
